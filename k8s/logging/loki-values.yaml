# Loki 单机模式（SingleBinary + filesystem），为 2C4G 学习集群裁剪
# 日志保留 3 天，关闭 gateway / canary / 查询缓存，不引入额外内存占用
#
# 安装（chart 7.5.0，走南京大学 GHCR 镜像）：
#   helm upgrade --install loki \
#     oci://ghcr.nju.edu.cn/grafana/helm-charts/loki \
#     -n logging --create-namespace --version 7.5.0 \
#     -f k8s/logging/loki-values.yaml
#
# 2C4G 上不要加 --wait/--atomic：就绪超时会回滚并删除 PVC
# 采集端配置见同目录 alloy-values.yaml

fullnameOverride: loki

deploymentMode: SingleBinary

# SingleBinary 模式下 SimpleScalable 组件必须全部为 0，否则 chart 校验失败
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

loki:
  # 单租户，Alloy 和 logcli 都不需要 X-Scope-OrgID
  auth_enabled: false
  analytics:
    reporting_enabled: false
  image:
    registry: docker.m.daocloud.io
    repository: grafana/loki
    tag: 3.6.11
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  limits_config:
    # 与 Prometheus 的 3 天保留期保持一致
    retention_period: 72h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: false

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 512Mi
  persistence:
    enabled: true
    storageClass: local-path
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    # 卸载 release 时保留 PVC，避免误删日志
    enableStatefulSetAutoDeletePVC: false

# 单机省资源：以下组件全部关闭
gateway:
  enabled: false
lokiCanary:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
sidecar:
  # 不用 Loki 告警规则，关闭 k8s-sidecar 规则同步容器
  rules:
    enabled: false
test:
  enabled: false
minio:
  enabled: false
