# kube-prometheus-stack values（K3s 单节点 2C4G，镜像走 DaoCloud 公共加速）
# 已按 2C4G 低配裁剪：关闭 Alertmanager、缩短 Prometheus 保留期、抓取间隔放宽到 60s
# 安装前先创建命名空间和 Grafana 密码 Secret：
#   kubectl create namespace monitoring
#   kubectl -n monitoring create secret generic grafana-admin \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password="$(openssl rand -base64 18)"
# 安装（国内使用南京大学 GHCR 镜像，chart 校验和与官方一致）：
#   helm upgrade --install kube-prometheus-stack \
#     oci://ghcr.nju.edu.cn/prometheus-community/charts/kube-prometheus-stack \
#     -n monitoring --create-namespace --version 92.17.1 -f k8s/monitoring/values.yaml

crds:
  enabled: true

# K3s 控制面组件合并进 k3s server，默认不暴露这些指标
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheusOperator:
  image:
    registry: quay.m.daocloud.io
    repository: prometheus-operator/prometheus-operator
  prometheusConfigReloader:
    image:
      registry: quay.m.daocloud.io
      repository: prometheus-operator/prometheus-config-reloader
  admissionWebhooks:
    patch:
      image:
        registry: ghcr.nju.edu.cn
        repository: jkroepke/kube-webhook-certgen
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 192Mi

prometheus:
  prometheusSpec:
    image:
      registry: quay.m.daocloud.io
      repository: prometheus/prometheus
    # 单节点只保留 3 天 / 1GB，降低 TSDB 内存与磁盘压力
    retention: 3d
    retentionSize: 1GB
    # 2C4G 上适当放宽抓取频率，减少 CPU 与序列数
    scrapeInterval: 60s
    evaluationInterval: 60s
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 400m
        memory: 640Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            # 已存在的 PVC 不能缩容，保持 5Gi；实际由 retentionSize 控制用量
            requests:
              storage: 5Gi
    # 允许 Prometheus 采集所有命名空间的 ServiceMonitor
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  # 2C4G 先关闭告警组件；需要告警时改为 true
  enabled: false
  alertmanagerSpec:
    image:
      registry: quay.m.daocloud.io
      repository: prometheus/alertmanager
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

kube-state-metrics:
  image:
    registry: k8s.m.daocloud.io
    repository: kube-state-metrics/kube-state-metrics
  resources:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      cpu: 100m
      memory: 96Mi

prometheus-node-exporter:
  image:
    registry: quay.m.daocloud.io
    repository: prometheus/node-exporter
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      cpu: 50m
      memory: 48Mi

grafana:
  image:
    registry: docker.m.daocloud.io
    repository: grafana/grafana
  initChownData:
    image:
      registry: docker.m.daocloud.io
      repository: library/busybox
  sidecar:
    image:
      registry: quay.m.daocloud.io
      repository: kiwigrid/k8s-sidecar
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 64Mi
    dashboards:
      # 只监听本命名空间，避免全集群 watch 增加 API Server 负担
      searchNamespace: monitoring
  admin:
    existingSecret: grafana-admin
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 320Mi
  persistence:
    enabled: true
    storageClassName: local-path
    size: 1Gi
  defaultDashboardsTimezone: Asia/Shanghai
