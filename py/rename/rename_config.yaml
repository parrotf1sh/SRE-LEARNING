# ====================================================
# 批量文件重命名工具 - 配置文件示例
# ====================================================

# [必填] 要处理的目录路径，支持相对路径和绝对路径
directory: "./test_files"

# [必填] 重命名模式，可选值：
#   seq     - 按序号编号重命名
#   date    - 按日期/时间戳重命名
#   replace - 字符串/正则替换重命名
#   format  - 格式转换（大小写、去空格、改扩展名等）
mode: "replace"

# ----------------------------------------------------
# replace 模式专用参数
# ----------------------------------------------------
# 要匹配的原始字符串或正则表达式
pattern: "IMG_"
# 替换后的目标字符串，支持反向引用如 \1, \2
replacement: "vacation_"

# ----------------------------------------------------
# format 模式专用参数
# ----------------------------------------------------
format_options:
  # 大小写转换，可选值：
  #   lower - 全部转小写
  #   upper - 全部转大写
  #   title - 首字母大写
  #   none  - 不做大小写转换
  case: "lower"
  # 是否去除文件名中的空格（true/false）
  strip_spaces: true
  # 统一修改文件扩展名，留空或不设置则保持不变
  # 示例：".jpg"、".txt"、".png"
  ext: ".jpg"

# ----------------------------------------------------
# seq 模式专用参数
# ----------------------------------------------------
seq_options:
  # 序号起始值，从该数字开始编号
  start: 1
  # 序号递增步长，如设为2则 1, 3, 5, 7 ...
  step: 1
  # 序号补零位数，如 3 则生成 001, 002, 010 ...
  padding: 3
  # 序号前的固定前缀字符串
  prefix: "file_"

# ----------------------------------------------------
# date 模式专用参数
# ----------------------------------------------------
date_options:
  # 日期格式字符串，遵循 Python strftime 规范
  # 常用占位符：
  #   %Y - 四位年份（2026）
  #   %m - 两位月份（01-12）
  #   %d - 两位日期（01-31）
  #   %H - 小时（00-23）
  #   %M - 分钟（00-59）
  #   %S - 秒（00-59）
  format: "%Y-%m-%d"
  # 日期来源，可选值：
  #   mtime - 文件最后修改时间
  #   ctime - 文件创建时间（macOS）/ 状态变更时间（Linux）
  #   name  - 从文件名中提取日期（需文件名含日期格式）
  source: "mtime"

# ----------------------------------------------------
# 通用选项
# ----------------------------------------------------
# 是否递归处理子目录（true = 递归，false = 仅当前目录）
recursive: false

# 文件名过滤：只处理匹配该 glob 模式的文件
# 示例：
#   "*"       - 所有文件
#   "*.jpg"   - 仅 JPG 图片
#   "IMG_*"   - 以 IMG_ 开头的文件
#   "*.{jpg,png}" - JPG 或 PNG 文件
include_pattern: "*"

# 文件名排除：跳过匹配该 glob 模式的文件
# 示例："*.bak"、"*.tmp"、".DS_Store"
exclude_pattern: "*.bak"

# ----------------------------------------------------
# 安全机制选项
# ----------------------------------------------------
# 预览模式（dry-run）：
#   true  - 仅打印重命名预览结果（原名 → 新名），不实际执行
#   false - 实际执行重命名操作
# 建议首次使用时设为 true，确认无误后再改为 false
dry_run: true

# 冲突处理策略，当目标文件名已存在时：
#   skip    - 跳过该文件，不做处理并打印警告
#   suffix  - 自动在文件名后加数字后缀（如 _1, _2）避免冲突
#   error   - 直接报错并终止程序
conflict_strategy: "suffix"

# 日志文件路径，记录每次重命名操作的详细信息
# 包含：操作时间、原名、新名、操作结果（成功/跳过/失败）
log_file: "rename.log"

# 是否启用回滚功能，将每次操作的逆操作记录到日志
# 开启后可通过 --rollback 参数从日志恢复原始文件名
#   true  - 记录回滚信息
#   false - 不记录
enable_rollback: true
