{{/*
Secret 引用说明文档

本 Chart 不直接创建 Secret，而是引用已存在的 Secret。
这样可以：
1. 避免敏感信息存储在 Git 仓库
2. 使用 External Secrets Operator 等工具管理 Secret
3. 手动创建和管理 Secret

创建数据库 Secret：
```bash
kubectl create secret generic task-api-db-secret \
  --from-literal=DB_HOST=mysql.default.svc.cluster.local \
  --from-literal=DB_PORT=3306 \
  --from-literal=DB_USER=root \
  --from-literal=DB_PASSWORD=yourpassword \
  --from-literal=DB_NAME=task_api \
  -n {{ include "task-api.namespace" . }}
```

创建 Redis Secret：
```bash
kubectl create secret generic task-api-redis-secret \
  --from-literal=REDIS_NODES="redis-node-0.redis.default.svc.cluster.local:6379,redis-node-1.redis.default.svc.cluster.local:6380" \
  -n {{ include "task-api.namespace" . }}
```

使用 External Secrets Operator（推荐）：
```yaml
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: task-api-db-secret
  namespace: {{ include "task-api.namespace" . }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: task-api-db-secret
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: /task-api/db/host
    - secretKey: DB_PASSWORD
      remoteRef:
        key: /task-api/db/password
```
*/}}

